version: 1.0.{build}
image: Visual Studio 2017
clone_depth: 1

environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

cache:
  - C:\thorignir-26972\build

build_script:
  - ps: |
      $ErrorActionPreference = "Stop"

      Write-Host "=================================================="
      Write-Host " THORIGNIR - EXTRAER PDB DEL CACHE"
      Write-Host "=================================================="

      $build = "C:\thorignir-26972\build"
      $out = Join-Path $env:APPVEYOR_BUILD_FOLDER "debug-files"
      New-Item -ItemType Directory -Path $out -Force | Out-Null

      Write-Host "Buscando worldserver.exe / worldserver.pdb..."
      $exe = Get-ChildItem $build -Recurse -File -Filter "worldserver.exe" -ErrorAction SilentlyContinue |
             Select-Object -First 1
      $pdb = Get-ChildItem $build -Recurse -File -Filter "worldserver.pdb" -ErrorAction SilentlyContinue |
             Select-Object -First 1

      if ($exe) {
          Copy-Item $exe.FullName $out -Force
          Write-Host "EXE: $($exe.FullName)"
      } else {
          Write-Host "No encontre worldserver.exe en cache."
      }

      if ($pdb) {
          Copy-Item $pdb.FullName $out -Force
          Write-Host "PDB: $($pdb.FullName)"
      } else {
          Write-Host ""
          Write-Host "PDB no encontrado. Listando PDB existentes:"
          Get-ChildItem $build -Recurse -File -Filter "*.pdb" -ErrorAction SilentlyContinue |
              Select-Object FullName,Length |
              Format-Table -AutoSize
          throw "No encontre worldserver.pdb en cache."
      }

      $zip = Join-Path $env:APPVEYOR_BUILD_FOLDER "Thorignir-worldserver-debug.zip"
      if (Test-Path $zip) { Remove-Item $zip -Force }

      Compress-Archive -Path "$out\*" -DestinationPath $zip -CompressionLevel Optimal
      Push-AppveyorArtifact $zip -FileName "Thorignir-worldserver-debug.zip"

      Write-Host ""
      Write-Host "LISTO -> Artifacts -> Thorignir-worldserver-debug.zip"

test: off
deploy: off

artifacts:
  - path: Thorignir-worldserver-debug.zip
    name: Thorignir worldserver debug
